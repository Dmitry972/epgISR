name: Generate EPG

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install EPG
        run: |
          git clone https://github.com/iptv-org/epg.git
          cd epg
          npm install

      - name: Generate EPG
        run: |
          cd epg
          cp ../myepgrenew.xml .
          npm run grab -- --channels=myepgrenew.xml --output=guide.xml
          cp guide.xml ../guide.xml

      - name: Commit guide
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@users.noreply.github.com"
          git add guide.xml
          git commit -m "update epg" || exit 0
          git push
