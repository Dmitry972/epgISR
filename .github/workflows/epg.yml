name: Generate EPG

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Clone iptv-org epg
        run: git clone https://github.com/iptv-org/epg.git

      - name: Install dependencies
        run: |
          cd epg
          npm install

      - name: Install Playwright browsers
        run: |
          cd epg
          npx playwright install --with-deps

      - name: Generate guide.xml
        run: |
          cd epg
          cp ../myepgrenew.xml .
          npm run grab -- --channels=myepgrenew.xml --output=guide.xml
          cp guide.xml ../guide.xml

      - name: Commit & Push
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@users.noreply.github.com"
          git add guide.xml
          git commit -m "Update EPG" || exit 0
          git push
